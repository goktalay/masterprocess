name: net-probe
# Geçici: ağ yakalamanın Windows'ta nasıl davrandığını ölçer. Ana dala taşınmaz.
on:
  push:
    branches: [net-probe]
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Yardımcıyı derle
        run: dotnet publish agent/MasterProcess.Agent.csproj -c Release -r win-x64 -o agent-out
      - name: Sürüm
        run: agent-out\mp-agent.exe --version
      - name: Kendi kendini sınama
        run: agent-out\mp-agent.exe --selftest
      - name: Ağ tanılama
        if: always()
        continue-on-error: true
        run: agent-out\mp-agent.exe --netdiag
      # Güvenlik duvarı açık, kural yok: giden veri ve geri döngü zorunlu; dışarıdan gelen veri beklenmez.
      - name: Ağ sınaması A1 (varsayılan, kuralsız)
        shell: pwsh
        run: ./scripts/agent-net-test.ps1 -Agent agent-out\mp-agent.exe -Label A1-default -InboundOptional
      - name: Ağ sınaması A2 (RCVALL_ON, bilgi amaçlı)
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          MP_NET_RCVALL: 'on'
        run: ./scripts/agent-net-test.ps1 -Agent agent-out\mp-agent.exe -Label A2-rcvall-on -InboundOptional
      # Yardımcıya gelen izin kuralı varken hepsi zorunlu. Runner tek kullanımlıktır; kural yine de geri alınır.
      - name: Ağ sınaması B (güvenlik duvarı izin kuralı)
        if: always()
        shell: pwsh
        run: |
          $exe = (Resolve-Path agent-out\mp-agent.exe).Path
          netsh advfirewall firewall add rule name="mp-agent-probe" dir=in action=allow program="$exe" enable=yes
          try { ./scripts/agent-net-test.ps1 -Agent agent-out\mp-agent.exe -Label B-firewall-rule; $code = $LASTEXITCODE }
          finally { netsh advfirewall firewall delete rule name="mp-agent-probe" }
          exit $code
      - name: Ağ sınaması C (güvenlik duvarı kapalı, bilgi amaçlı)
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          netsh advfirewall set allprofiles state off
          try { ./scripts/agent-net-test.ps1 -Agent agent-out\mp-agent.exe -Label C-firewall-off; $code = $LASTEXITCODE }
          finally { netsh advfirewall set allprofiles state on }
          exit $code
