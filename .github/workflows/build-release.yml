name: Build Process Explorer Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'ProcessExplorer/**'
      - 'setup.iss'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Clean
        run: dotnet clean -c Release

      - name: Build
        run: dotnet build -c Release

      - name: Verify binary
        run: |
          if (-not (Test-Path "ProcessExplorer\bin\Release\net8.0-windows\ProcessExplorer.exe")) {
            Write-Error "Binary not found!"
            exit 1
          }
          Write-Host "✓ Binary created successfully"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProcessExplorer-Release
          path: ProcessExplorer/bin/Release/net8.0-windows/
          retention-days: 30

      - name: Upload to mastertool.download
        if: secrets.PROCESSEXPLORER_RELEASE_KEY != ''
        env:
          RELEASE_KEY: ${{ secrets.PROCESSEXPLORER_RELEASE_KEY }}
        run: |
          $exe = "ProcessExplorer\bin\Release\net8.0-windows\ProcessExplorer.exe"
          if (Test-Path $exe) {
            Write-Host "✓ Found: $exe" -ForegroundColor Green
            $size = [math]::Round((Get-Item $exe).Length/1MB, 2)
            Write-Host "Size: $size MB" -ForegroundColor Cyan

            try {
              $response = Invoke-WebRequest `
                -Uri "https://mastertool.download/api/pe/releases/upload" `
                -Method POST `
                -Headers @{"X-Release-Key" = $env:RELEASE_KEY} `
                -Form @{file = Get-Item $exe} `
                -StatusCodeVariable "statusCode"

              Write-Host "✓ Upload successful! Status: $statusCode" -ForegroundColor Green
            } catch {
              Write-Host "✗ Upload error: $($_.Exception.Message)" -ForegroundColor Red
              Write-Host "Response: $($_.Exception.Response.StatusCode)" -ForegroundColor Yellow
            }
          } else {
            Write-Host "✗ File not found: $exe" -ForegroundColor Red
            exit 1
          }
