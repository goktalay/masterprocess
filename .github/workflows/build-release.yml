name: Build Process Explorer Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'ProcessExplorer/**'
      - 'setup.iss'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Clean
        run: dotnet clean -c Release

      - name: Build
        run: dotnet build -c Release

      - name: Verify binary
        run: |
          if (-not (Test-Path "ProcessExplorer\bin\Release\net8.0-windows\ProcessExplorer.exe")) {
            Write-Error "Binary not found!"
            exit 1
          }
          Write-Host "✓ Binary created successfully"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProcessExplorer-Release
          path: ProcessExplorer/bin/Release/net8.0-windows/
          retention-days: 30

      - name: Create installer
        continue-on-error: true
        run: |
          $ISCCPaths = @(
            "C:\Program Files\Inno Setup 7\ISCC.exe",
            "C:\Program Files (x86)\Inno Setup 7\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe",
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          )
          $ISCC = $ISCCPaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($ISCC) {
            & $ISCC "setup.iss"
            Write-Host "✓ Installer created"
          } else {
            Write-Host "⚠ InnoSetup not found, skipping installer"
          }

      - name: Upload to mastertool.download
        if: secrets.PROCESSEXPLORER_RELEASE_KEY != ''
        env:
          RELEASE_KEY: ${{ secrets.PROCESSEXPLORER_RELEASE_KEY }}
          MASTERTOOL_URL: https://mastertool.download
        shell: pwsh
        run: |
          $exe = Get-Item "ProcessExplorer\bin\Release\net8.0-windows\ProcessExplorer.exe"
          Write-Host "Uploading ProcessExplorer.exe..." -ForegroundColor Green
          Write-Host "File: $($exe.FullName)" -ForegroundColor Cyan
          Write-Host "Size: $([math]::Round($exe.Length/1MB, 2)) MB" -ForegroundColor Cyan

          try {
            $uri = "$env:MASTERTOOL_URL/api/pe/releases/upload"
            $headers = @{
              "X-Release-Key" = $env:RELEASE_KEY
            }

            $response = Invoke-WebRequest -Uri $uri `
              -Method POST `
              -Headers $headers `
              -Form @{file = $exe} `
              -ErrorAction Stop

            Write-Host "✓ Upload successful!" -ForegroundColor Green
            Write-Host "Response: $($response.StatusCode)" -ForegroundColor Green
          }
          catch {
            Write-Host "✗ Upload failed!" -ForegroundColor Red
            Write-Host "Error: $($_.Exception.Message)" -ForegroundColor Red
            exit 1
          }
